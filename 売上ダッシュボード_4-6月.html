<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>売上ダッシュボード</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%229%22 width=%223%22 height=%225%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3Crect x=%226.5%22 y=%225%22 width=%223%22 height=%229%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3Crect x=%2211%22 y=%222%22 width=%223%22 height=%2212%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e4e3df;
    --grid: #ecebe7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --series-1: #2a78d6;
    --series-1-soft: #2a78d61f;
    --good: #0f7b3d;
    --critical: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --grid: #262624;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --series-1: #3987e5;
      --series-1-soft: #3987e52e;
      --good: #4cc27a;
      --critical: #f07070;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110;
    --surface-1: #1a1a19;
    --border: #2e2e2c;
    --grid: #262624;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-1-soft: #3987e52e;
    --good: #4cc27a;
    --critical: #f07070;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-feature-settings: "tnum";
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .kpi .label { font-size: 13px; color: var(--text-secondary); }
  .kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; white-space: nowrap; }
  .kpi .value small { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .kpi .note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .kpi.hero .value { font-size: 34px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; }
  .card h2 { font-size: 16px; margin: 0; }
  .card .desc { font-size: 13px; color: var(--text-secondary); margin: 2px 0 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

  .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .toggle button { border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--series-1-soft); color: var(--text-primary); font-weight: 600; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--text-secondary); font-size: 12px; }
  svg .val { fill: var(--text-primary); font-weight: 600; font-size: 13px; }
  svg .gridline { stroke: var(--grid); stroke-width: 1; }
  svg .baseline { stroke: var(--text-muted); stroke-width: 1; }
  svg .bar { fill: var(--series-1); }
  svg .hit { fill: transparent; cursor: default; }
  svg .hit:hover + .bar, svg g.row:hover .bar, svg g.col:hover .bar { opacity: .82; }

  .delta { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .delta span { font-size: 12px; color: var(--text-secondary); background: var(--bg); border-radius: 6px; padding: 3px 8px; }
  .delta b.up { color: var(--good); }
  .delta b.down { color: var(--critical); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
  .table-scroll { overflow-x: auto; }
  [hidden] { display: none !important; }

  #tip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    padding: 8px 10px; font-size: 12px; line-height: 1.6;
    opacity: 0; transition: opacity .1s;
  }
  #tip b { font-size: 13px; }
  #tip .m { color: var(--text-secondary); }

  header > * { max-width: 100%; min-width: 0; }
  .source { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .source .current { font-size: 13px; color: var(--text-secondary); text-align: right; }
  .source .current b { color: var(--text-primary); font-weight: 600; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    background: var(--series-1); border: 0; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--text-muted); flex-basis: 100%; text-align: right; }
  .msg { flex-basis: 100%; text-align: right; font-size: 13px; min-height: 0; }
  .msg.error { color: var(--critical); }
  .msg.ok { color: var(--good); }

  /* ドラッグ中に画面全体に出す受け皿 */
  #drop {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(2px);
  }
  #drop.show { display: flex; }
  #drop .box {
    border: 3px dashed var(--series-1); border-radius: 16px;
    background: var(--surface-1); padding: 40px 48px; text-align: center;
    max-width: calc(100% - 32px);
  }
  #drop .big { font-size: 22px; font-weight: 700; }
  #drop .small { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  footer { margin-top: 24px; font-size: 12px; color: var(--text-muted); }

  @media (max-width: 820px) {
    header { flex-direction: column; align-items: stretch; }
    .source { justify-content: flex-start; }
    .source .current, .hint, .msg { text-align: left; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
    .kpi .value { font-size: 22px; }
    .kpi.hero .value { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>売上ダッシュボード</h1>
      <div class="sub" id="period"></div>
    </div>
    <div class="source">
      <div class="current" id="current"></div>
      <button class="btn" id="pick" type="button">CSVを選ぶ</button>
      <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
      <div class="hint">CSVファイルをこの画面にドラッグ&amp;ドロップしても表示できます（複数まとめて可）</div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <div class="card-head">
        <div>
          <h2>月別売上推移</h2>
          <p class="desc">月ごとの売上金額の合計</p>
        </div>
        <div class="toggle" data-target="month">
          <button aria-pressed="true" data-view="chart">グラフ</button><button aria-pressed="false" data-view="table">表</button>
        </div>
      </div>
      <div id="month-chart"></div>
      <div id="month-table" class="table-scroll" hidden></div>
      <div class="delta" id="month-delta"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <h2>商品別売上ランキング</h2>
          <p class="desc">期間合計の売上金額が大きい順</p>
        </div>
        <div class="toggle" data-target="rank">
          <button aria-pressed="true" data-view="chart">グラフ</button><button aria-pressed="false" data-view="table">表</button>
        </div>
      </div>
      <div id="rank-chart"></div>
      <div id="rank-table" class="table-scroll" hidden></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>
<div id="drop" aria-hidden="true">
  <div class="box">
    <div class="big">ここにCSVをドロップ</div>
    <div class="small">列：日付, 商品名, カテゴリ, 地域, 数量, 単価, 売上金額</div>
  </div>
</div>

const HEADER = ["日付", "商品名", "カテゴリ", "地域", "数量", "単価", "売上金額"];

// ---- データ読み込み ----
function parseCSV(text) {
  const lines = text.replace(/^﻿/, "").trim().split(/\r?\n/);
  const head = lines[0].split(",").map(s => s.trim());
  if (head.join() !== HEADER.join()) throw new Error("列の形式が違います：" + head.join(","));
  return lines.slice(1).filter(l => l.trim()).map(l => {
    const c = l.split(","), o = {};
    head.forEach((h, i) => o[h] = (c[i] || "").trim());
    o.数量 = +o.数量; o.単価 = +o.単価; o.売上金額 = +o.売上金額;
    return o;
  });
}

let rows, total, qty, months, products;

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const num = n => Math.round(n).toLocaleString("ja-JP");
const man = n => (n / 10000).toLocaleString("ja-JP", { maximumFractionDigits: 1 }) + "万";
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
// 上端だけ角丸（4px）のバー。dir="up" は縦棒、"right" は横棒
function barPath(x, y, w, h, dir) {
  const r = Math.min(4, dir === "up" ? w / 2 : h / 2, dir === "up" ? h : w);
  if (dir === "up")
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}

// ---- 集計して全体を描き直す ----
function render(data, sourceName) {
  rows = data;
  total = rows.reduce((s, r) => s + r.売上金額, 0);
  qty = rows.reduce((s, r) => s + r.数量, 0);
  const dates = rows.map(r => r.日付).sort();

  const monthMap = new Map();
  rows.forEach(r => {
    const k = r.日付.slice(0, 7);
    const m = monthMap.get(k) || { 売上: 0, 件数: 0, 数量: 0 };
    m.売上 += r.売上金額; m.件数++; m.数量 += r.数量;
    monthMap.set(k, m);
  });
  months = [...monthMap.entries()].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([k, v]) => ({ key: k, label: +k.slice(5) + "月", ...v }));

  const prodMap = new Map();
  rows.forEach(r => {
    const p = prodMap.get(r.商品名) || { 名前: r.商品名, カテゴリ: r.カテゴリ, 売上: 0, 数量: 0, 件数: 0 };
    p.売上 += r.売上金額; p.数量 += r.数量; p.件数++;
    prodMap.set(r.商品名, p);
  });
  products = [...prodMap.values()].sort((a, b) => b.売上 - a.売上);

  const best = months.reduce((a, b) => (b.売上 > a.売上 ? b : a));

  // ---- ヘッダー・KPI ----
  document.getElementById("period").textContent =
    `集計期間：${dates[0].replaceAll("-", "/")} 〜 ${dates[dates.length - 1].replaceAll("-", "/")}（${months.length}か月）`;

  const kpis = [
    { label: "合計売上", value: num(total), unit: "円", note: `月平均 ${yen(total / months.length)}`, hero: true },
    { label: "販売件数", value: num(rows.length), unit: "件", note: `1件あたり ${yen(total / rows.length)}` },
    { label: "販売数量", value: num(qty), unit: "個", note: `平均単価 ${yen(total / qty)}` },
    { label: "最も売れた月", value: best.label, unit: "", note: `${yen(best.売上)}（全体の${(best.売上 / total * 100).toFixed(1)}%）` },
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k => `
    <div class="card kpi${k.hero ? " hero" : ""}">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}<small>${k.unit}</small></div>
      <div class="note">${k.note}</div>
    </div>`).join("");

  drawMonths();
  drawRanking();
  document.getElementById("foot").textContent =
    `データ：${sourceName}（${rows.length}件）／棒にカーソルを合わせると詳細が表示されます`;
}

// ---- ツールチップ ----
const tip = document.getElementById("tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => (tip.style.opacity = 0);

// 目盛りをキリのいい数に
function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

// ---- 月別推移（縦棒） ----
function drawMonths() {
  const W = 420, H = 280, m = { t: 28, r: 8, b: 32, l: 48 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = niceMax(Math.max(...months.map(d => d.売上)) * 1.05);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "月別売上の棒グラフ" });
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = max / ticks * i, y = m.t + ih - ih * v / max;
    if (i > 0) svg.append(el("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y, y2: y }));
    svg.append(el("text", { x: m.l - 8, y: y + 4, "text-anchor": "end" }, man(v)));
  }
  const band = iw / months.length, bw = Math.min(64, band * 0.6);
  const peak = months.reduce((a, b) => (b.売上 > a.売上 ? b : a));
  months.forEach((d, i) => {
    const cx = m.l + band * i + band / 2;
    const h = ih * d.売上 / max, y = m.t + ih - h;
    const g = el("g", { class: "col" });
    g.append(el("path", { class: "bar", d: barPath(cx - bw / 2, y, bw, h, "up") }));
    // 月が多いときは重ならないよう、いちばん売れた月だけ金額を書く（他はカーソルで確認）
    if (months.length <= 6 || d === peak)
      g.append(el("text", { class: "val", x: cx, y: y - 8, "text-anchor": "middle" }, man(d.売上) + (months.length <= 6 ? "円" : "")));
    g.append(el("text", { x: cx, y: H - m.b + 20, "text-anchor": "middle" }, d.label));
    const hit = el("rect", { class: "hit", x: m.l + band * i, y: m.t, width: band, height: ih });
    const html = `<b>${d.key.replace("-", "年")}月</b><br>売上 ${yen(d.売上)}<br><span class="m">${num(d.件数)}件・${num(d.数量)}個</span>`;
    hit.addEventListener("mousemove", e => showTip(e, html));
    hit.addEventListener("mouseleave", hideTip);
    g.append(hit);
    svg.append(g);
  });
  svg.append(el("line", { class: "baseline", x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih }));
  document.getElementById("month-chart").replaceChildren(svg);

  // 前月比
  document.getElementById("month-delta").innerHTML = months.slice(1).map((d, i) => {
    const prev = months[i].売上, r = (d.売上 - prev) / prev * 100;
    const cls = r >= 0 ? "up" : "down", sign = r >= 0 ? "▲ +" : "▼ ";
    return `<span>${months[i].label}→${d.label}：<b class="${cls}">${sign}${r.toFixed(1)}%</b></span>`;
  }).join("");

  document.getElementById("month-table").innerHTML = `<table>
    <thead><tr><th>月</th><th></th><th>売上金額</th><th>件数</th><th>数量</th><th>前月比</th></tr></thead>
    <tbody>${months.map((d, i) => `<tr><td>${d.label}</td><td></td><td>${yen(d.売上)}</td><td>${num(d.件数)}</td><td>${num(d.数量)}</td>
      <td>${i ? ((d.売上 - months[i - 1].売上) / months[i - 1].売上 * 100).toFixed(1) + "%" : "—"}</td></tr>`).join("")}
    <tr><td><b>合計</b></td><td></td><td><b>${yen(total)}</b></td><td>${num(rows.length)}</td><td>${num(qty)}</td><td></td></tr></tbody></table>`;
}

// ---- 商品別ランキング（横棒） ----
function drawRanking() {
  const W = 560, rowH = 34, m = { t: 4, r: 96, b: 4, l: 168 };
  const H = m.t + m.b + rowH * products.length;
  const iw = W - m.l - m.r;
  const max = products[0].売上;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "商品別売上ランキングの横棒グラフ" });
  products.forEach((p, i) => {
    const y = m.t + rowH * i, bh = 18, by = y + (rowH - bh) / 2;
    const w = Math.max(2, iw * p.売上 / max);
    const g = el("g", { class: "row" });
    g.append(el("text", { x: 0, y: y + rowH / 2 + 4, class: "val" }, `${i + 1}`));
    g.append(el("text", { x: 22, y: y + rowH / 2 + 4 }, p.名前));
    g.append(el("path", { class: "bar", d: barPath(m.l, by, w, bh, "right") }));
    g.append(el("text", { class: "val", x: m.l + w + 8, y: y + rowH / 2 + 4 }, man(p.売上) + "円"));
    const hit = el("rect", { class: "hit", x: 0, y, width: W, height: rowH });
    const html = `<b>${i + 1}位 ${p.名前}</b><br>売上 ${yen(p.売上)}（${(p.売上 / total * 100).toFixed(1)}%）<br><span class="m">${p.カテゴリ}・${num(p.数量)}個・${num(p.件数)}件</span>`;
    hit.addEventListener("mousemove", e => showTip(e, html));
    hit.addEventListener("mouseleave", hideTip);
    g.append(hit);
    svg.append(g);
  });
  svg.append(el("line", { class: "baseline", x1: m.l, x2: m.l, y1: m.t, y2: H - m.b }));
  document.getElementById("rank-chart").replaceChildren(svg);

  document.getElementById("rank-table").innerHTML = `<table>
    <thead><tr><th>順位</th><th>商品名</th><th>売上金額</th><th>構成比</th><th>数量</th><th>件数</th></tr></thead>
    <tbody>${products.map((p, i) => `<tr><td>${i + 1}</td><td>${p.名前}</td><td>${yen(p.売上)}</td>
      <td>${(p.売上 / total * 100).toFixed(1)}%</td><td>${num(p.数量)}</td><td>${num(p.件数)}</td></tr>`).join("")}</tbody></table>`;
}

// ---- グラフ／表 切り替え ----
document.querySelectorAll(".toggle").forEach(t => {
  t.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    t.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const id = t.dataset.target, isTable = b.dataset.view === "table";
    document.getElementById(id + "-chart").hidden = isTable;
    document.getElementById(id + "-table").hidden = !isTable;
    if (id === "month") document.getElementById("month-delta").hidden = isTable;
  });
});

// ---- CSVの取り込み（ドラッグ&ドロップ／ファイル選択） ----
const msg = document.getElementById("msg");
const current = document.getElementById("current");
const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg" + (type ? " " + type : "");
}
function showCurrent(names) {
  current.innerHTML = "表示中：" + names.map(n => `<b>${n.replace(/[&<>"]/g, c => "&#" + c.charCodeAt(0) + ";")}</b>`).join("、");
}

// UTF-8 で読めなければ、Excel で保存した Shift_JIS として読む
async function readText(file) {
  const buf = await file.arrayBuffer();
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch {
    return new TextDecoder("shift_jis").decode(buf);
  }
}

async function loadFiles(fileList) {
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === "text/csv");
  if (!files.length) { showMsg("CSVファイル（.csv）を選んでください", "error"); return; }
  const all = [], ok = [], ng = [];
  for (const f of files) {
    try {
      const data = parseCSV(await readText(f));
      if (!data.length) throw new Error("データの行がありません");
      all.push(...data); ok.push(f.name);
    } catch (e) {
      ng.push(`${f.name}（${e.message}）`);
    }
  }
  if (ok.length) {
    all.sort((a, b) => a.日付.localeCompare(b.日付));
    render(all, ok.join("、"));
    showCurrent(ok);
  }
  const done = `${ok.length}ファイル・${all.length.toLocaleString("ja-JP")}件を読み込みました`;
  if (!ng.length) showMsg(done, "ok");
  else showMsg((ok.length ? done + "。" : "表示は前のままです。") + "読み込めなかったファイル：" + ng.join(" / "), "error");
}

document.getElementById("pick").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { loadFiles(fileInput.files); fileInput.value = ""; });

// 画面のどこにドロップしても受け取る
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; drop.classList.add("show"); });
addEventListener("dragover", e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; drop.classList.remove("show"); } });
addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; drop.classList.remove("show");
  loadFiles(e.dataTransfer.files);
});

// 最初は内蔵の4-6月データを表示
render(parseCSV(EMBEDDED.text), EMBEDDED.name);
showCurrent([EMBEDDED.name + "（内蔵データ）"]);
